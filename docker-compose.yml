services:
  icms-db:
    image: postgres:16-alpine
    container_name: icms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icms}
      POSTGRES_USER: ${POSTGRES_USER:-icms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icms_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icms} -d ${POSTGRES_DB:-icms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  icms-backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: icms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ICMS Backend
      APP_VERSION: 1.0.0
      DEBUG: "True"
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-icms}:${POSTGRES_PASSWORD:-icms_password}@db:5432/${POSTGRES_DB:-icms}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-before-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ALLOWED_ORIGIN_REGEX: ${ALLOWED_ORIGIN_REGEX:-https?://(localhost|127\.0\.0\.1|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[0-1])\.\d+\.\d+)(:\d+)?}
      UPLOAD_DIR: ./uploads
      LOG_LEVEL: INFO
      LOG_FILE: ./logs/icms.log
      RUN_MIGRATIONS: "true"
      RUN_SEED_DATA: ${RUN_SEED_DATA:-true}
      SEED_DATA_RESEED: ${SEED_DATA_RESEED:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/uploads:/app/Backend/uploads
      - ./Backend/logs:/app/Backend/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
